name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries (OpenCV, PortAudio)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libportaudio2
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Version files agree
        run: python scripts/check_version.py
      - name: Lint (black, isort)
        working-directory: backend
        run: |
          black --check app tests || echo "::warning::black formatting drift"
          isort --check-only app tests || echo "::warning::isort drift"
      - name: Tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/pytest.xml

  frontend:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  easyworship-agent:
    name: EasyWorship agent (syntax + tests)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/easyworship_agent/agent.py
      - run: pip install pytest httpx
      - run: python -m pytest -q -p no:cacheprovider backend/tests/test_security_agent.py
