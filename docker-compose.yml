version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: church-prod-postgres
    environment:
      POSTGRES_DB: church_production
      POSTGRES_USER: church
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: church-prod-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    profiles:
      - ai

  pgvector:
    image: pgvector/pgvector:pg15
    container_name: church-prod-pgvector
    environment:
      POSTGRES_DB: church_production
      POSTGRES_USER: church
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    profiles:
      - production

volumes:
  postgres_data:
  ollama_data:
  pgvector_data:
